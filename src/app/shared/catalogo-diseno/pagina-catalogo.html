<section aria-labelledby="titulo-catalogo">
  <div class="page-title">
    <h1 id="titulo-catalogo">{{ config.title }}</h1>
    <p>{{ config.subtitle }}</p>
  </div>
  <div [class.dual]="!!secundario">
    <app-catalogo-diseno [config]="config" />
    @if (secundario; as catalogoSecundario) {
      <app-catalogo-diseno [config]="catalogoSecundario" />
    }
  </div>
</section>
